<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>영업 레이더 팩스</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Gowun+Batang:wght@700&display=swap">
<style>
/* Layout: 좌측 검색 패널 + 결과 표(데스크톱) / 세로 스택(모바일), 업체 상세는 오른쪽 서랍 */
:root{
  --bg:#f3f3ee; --surface:#ffffff; --sunk:#ecebe4; --ink:#1d211c; --sub:#646b61; --line:#dcdcd2;
  --accent:#3f5a2c; --accent-ink:#ffffff; --accent-soft:#e3ead9;
  --ok:#2c6e45; --ok-soft:#dcefe2; --warn:#8a5c00; --warn-soft:#f6ead0; --bad:#9c3328; --bad-soft:#f6dfdb;
  --star:#b08a1e;
  --f-display:"Gowun Batang",serif; --f-body:"IBM Plex Sans KR",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151814; --surface:#1d211c; --sunk:#252a23; --ink:#e8eae3; --sub:#9aa293; --line:#343a31;
  --accent:#a9c98d; --accent-ink:#152011; --accent-soft:#2b3824;
  --ok:#86cf9f; --ok-soft:#1f3527; --warn:#e3b95a; --warn-soft:#3a2f17; --bad:#f09484; --bad-soft:#3d221e; --star:#e2c35b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151814; --surface:#1d211c; --sunk:#252a23; --ink:#e8eae3; --sub:#9aa293; --line:#343a31;
  --accent:#a9c98d; --accent-ink:#152011; --accent-soft:#2b3824;
  --ok:#86cf9f; --ok-soft:#1f3527; --warn:#e3b95a; --warn-soft:#3a2f17; --bad:#f09484; --bad-soft:#3d221e; --star:#e2c35b; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1280px;margin:0 auto}
header.top{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-block:22px 16px;border-bottom:1px solid var(--line)}
header.top h1{font-family:var(--f-display);font-size:28px;line-height:1.2;margin:0;letter-spacing:-.01em;text-wrap:balance}
header.top .sub{color:var(--sub);font-size:13px;margin-top:2px}
.tabs{margin-left:auto;display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:10px}
.tabs button{border:0;background:transparent;color:var(--sub);font:inherit;font-size:14px;font-weight:500;padding:7px 14px;border-radius:7px;cursor:pointer}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.count{font-family:var(--f-mono);font-size:12px;margin-left:4px;color:var(--accent)}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;margin-top:20px}
.filters{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px 16px;align-items:end}
.filters .full{grid-column:1/-1}
label.lb{display:block;font-size:12px;font-weight:600;color:var(--sub);margin-bottom:5px;letter-spacing:.02em}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:14px;background:var(--surface);color:var(--ink)}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sunk);border-radius:9px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;padding:8px 4px;font:inherit;font-size:13px;font-weight:500;color:var(--sub);border-radius:7px;cursor:pointer;line-height:1.3}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--sub);border-radius:999px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer}
.chip.on,.chip:hover{border-color:var(--accent);color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:8px;font:inherit;font-size:14px;font-weight:500;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--sub)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.hint{font-size:12px;color:var(--sub);line-height:1.5}
.err{background:var(--bad-soft);color:var(--bad);padding:10px 12px;border-radius:8px;font-size:13px}
.resbar{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.resbar .n{font-family:var(--f-mono);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums}
.resbar .what{color:var(--sub);font-size:13px}
.resbar .act{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.resbar select{width:auto;padding:7px 8px}
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:11px;font-weight:600;color:var(--sub);letter-spacing:.04em;background:var(--sunk);white-space:nowrap}
td.nm{font-weight:600;min-width:140px}
td.addr{min-width:240px;color:var(--sub)}
td.nowrap{white-space:nowrap}
td.num{text-align:right}
td.mono,.mono{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--sunk)}
td.st{width:28px;color:var(--star);text-align:center;padding-right:0}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-bad{background:var(--bad-soft);color:var(--bad)}.p-stage{background:var(--accent-soft);color:var(--accent)}
.new{font-size:11px;font-weight:700;color:var(--accent);margin-left:6px}
.empty{padding:36px 16px;text-align:center;color:var(--sub)}
.pager{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:12px}
@media (max-width:640px){.hide-sm{display:none}}
/* drawer */
.dim{position:fixed;inset:0;background:rgba(10,12,9,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:21;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 20px) max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) 20px;display:grid;gap:14px;align-content:start}
.drawer h2{font-family:var(--f-display);font-size:24px;margin:0;line-height:1.25;text-wrap:balance}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
dl{display:grid;grid-template-columns:96px minmax(0,1fr);gap:7px 12px;margin:0;font-size:14px}
dt{color:var(--sub);font-size:13px}dd{margin:0;word-break:break-word}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sect{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:10px}
.sect h3{margin:0;font-size:15px}
textarea{min-height:84px;resize:vertical}
/* leads */
.leadbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:20px 0 12px}
.leadbar select{width:auto}
.leadbar .sp{flex:1}
.leads{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.lead{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:6px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.lead:hover{border-color:var(--sub)}
.lead .t{display:flex;justify-content:space-between;gap:8px;align-items:start}
.lead h3{margin:0;font-size:16px}
.lead .memo{font-size:13px;color:var(--ink);white-space:pre-line;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.login{max-width:380px;margin:60px auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;display:grid;gap:12px}
.login h2{font-family:var(--f-display);margin:0;font-size:22px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;z-index:30}
.faxstat{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:20px 0 12px;font-size:13px}
.faxgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@media (min-width:960px){.faxgrid{grid-template-columns:minmax(0,420px) minmax(0,1fr)}}
.sumbox{background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:12px;font-size:13px;display:grid;gap:8px}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <h1>영업 레이더 <span style="color:var(--accent)">· 팩스</span></h1>
      <div class="sub">경상남도 제조업체 · 경상남도 노인복지시설(경상남도, 실시간) · 가맹본부 일반정보 변경이력(공정거래위원회) · 팩스 발송(팝빌)</div>
    </div>
    <nav class="tabs" aria-label="화면">
      <button id="tabSearch" class="on" type="button">업체 조회</button>
      <button id="tabLeads" type="button">관심업체<span class="count" id="leadCount">0</span></button>
      <button id="tabFax" type="button">팩스 발송<span class="count" id="rcvCount">0</span></button>
    </nav>
  </header>

  <section id="loginView" class="login" hidden>
    <h2>접속 비밀번호</h2>
    <p class="hint" style="margin:0">조회 서버를 보호하는 비밀번호입니다. 한 번 넣으면 이 브라우저에서 기억합니다.</p>
    <form id="loginForm" class="row">
      <input id="pwInput" type="password" autocomplete="current-password" placeholder="비밀번호" style="flex:1">
      <button class="btn primary" type="submit">들어가기</button>
    </form>
    <div id="loginErr" class="err" hidden></div>
  </section>

  <section id="searchView">
    <div class="layout">
      <form class="filters" id="filterForm">
        <div class="full">
          <label class="lb">자료</label>
          <div class="seg" id="typeSeg">
            <button type="button" data-v="mfr" class="on">경남<br>제조업체</button>
            <button type="button" data-v="senior">경남<br>노인복지시설</button>
            <button type="button" data-v="fc">가맹본부<br>(공정위)</button>
          </div>
        </div>
        <div class="gn"><label class="lb" for="fQ" id="fQLabel">이름·업종·생산품에 포함</label><input id="fQ" placeholder="식품, 참기름, 기계"></div>
        <div class="gn"><label class="lb" for="fAddr">주소에 포함</label><input id="fAddr" placeholder="마산회원구, 진주"></div>
        <div class="gn"><label class="lb" for="fSgg">시·군</label><select id="fSgg"><option value="">전체</option></select></div>
        <div class="gn">
          <label class="lb">팩스번호</label>
          <label class="hint" style="display:flex;gap:6px;align-items:center;padding:9px 0"><input id="fFaxOnly" type="checkbox" checked style="width:auto"> 팩스번호 있는 곳만</label>
        </div>
        <div class="fc" hidden><label class="lb" for="fFq">브랜드·본부명·업종·상품에 포함</label><input id="fFq" placeholder="치킨, 떡, 반찬, 본죽"></div>
        <div class="fc" hidden><label class="lb" for="fLcls">업종 대분류</label><select id="fLcls"><option value="">전체</option></select></div>
        <div class="fc" hidden><label class="lb" for="fYear">가맹사업 기준년도</label><input id="fYear" inputmode="numeric" maxlength="4" class="mono"></div>
        <div class="row"><button class="btn primary" type="submit" id="searchBtn" style="flex:1;justify-content:center">조회</button><button class="btn" type="button" id="resetBtn">초기화</button></div>
        <p class="hint full gn" id="gnNote" style="margin:0"></p>
        <p class="hint full fc" hidden style="margin:0"><span id="fcNote"></span> 공정거래위원회 가맹정보입니다. 브랜드 목록으로 가맹본부를 찾고, 화면에 보이는 본부마다 일반정보 최신 이력에서 전화·팩스·주소를 가져옵니다. 한 쪽에 몇 초 걸릴 수 있습니다.</p>
        <div id="err" class="err full" hidden></div>
      </form>

      <div style="min-width:0">
        <div class="resbar">
          <span class="n" id="total">–</span>
          <span class="what" id="totalWhat">건</span>
          <div class="act">
            <select id="perPage" aria-label="페이지당 건수"><option value="20">20개씩</option><option value="50" selected>50개씩</option><option value="100">100개씩</option></select>
            <button class="btn" type="button" id="toFaxBtn">결과를 팩스 수신처로</button>
            <button class="btn" type="button" id="exportPageBtn">이 페이지 CSV</button>
            <button class="btn" type="button" id="exportAllBtn">전체 CSV</button>
          </div>
        </div>
        <p id="scanNote" class="hint" hidden style="margin:0 0 8px"></p>
        <div class="tablewrap">
          <table>
            <thead id="thead"></thead>
            <tbody id="rows"><tr><td colspan="8" class="empty">불러오는 중…</td></tr></tbody>
          </table>
        </div>
        <div class="pager" id="pager"></div>
      </div>
    </div>
  </section>

  <section id="leadsView" hidden>
    <div class="leadbar">
      <select id="leadFilter" aria-label="영업 단계"><option value="">모든 단계</option></select>
      <input id="leadSearch" placeholder="업체명·메모 검색" style="max-width:240px">
      <span class="sp"></span>
      <button class="btn" type="button" id="leadsToFaxBtn">보이는 업체를 팩스 수신처로</button>
      <button class="btn" type="button" id="exportLeadsBtn">관심업체 CSV</button>
    </div>
    <div id="leadNote" class="hint" style="margin-bottom:10px"></div>
    <div class="leads" id="leadList"></div>
  </section>
</div>

  <section id="faxView" hidden>
    <div id="faxStatus" class="faxstat"></div>
    <div class="faxgrid">
      <form class="filters" id="faxForm" style="grid-template-columns:minmax(0,1fr)">
        <div class="two">
          <div><label class="lb" for="fxSender">발신번호</label><select id="fxSender"><option value="">불러오는 중…</option></select></div>
          <div><label class="lb" for="fxSenderName">발신자명</label><input id="fxSenderName" maxlength="50" placeholder="골목상회"></div>
        </div>
        <div><label class="lb" for="fxTitle">제목 (내역 확인용)</label><input id="fxTitle" maxlength="100" placeholder="골목공구 입점 제안서"></div>
        <div>
          <label class="lb" for="fxRcvText">수신처 <span class="hint" style="font-weight:400">한 줄에 하나씩 · 팩스번호, 업체명</span></label>
          <textarea id="fxRcvText" rows="6" class="mono" placeholder="055-123-4567, 마산청과&#10;0552223333, 회원방앗간"></textarea>
          <p class="hint" id="fxRcvNote" style="margin:6px 0 0"></p>
        </div>
        <div>
          <label class="lb" for="fxFiles">보낼 파일 <span class="hint" style="font-weight:400">PDF·이미지·한글·워드 등, 5개·10MB까지</span></label>
          <input id="fxFiles" type="file" multiple accept=".pdf,.jpg,.jpeg,.png,.gif,.tif,.tiff,.bmp,.hwp,.hwpx,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt">
        </div>
        <div class="two">
          <div><label class="lb" for="fxReserve">예약 발송 (선택)</label><input id="fxReserve" type="datetime-local"></div>
          <div><label class="lb">&nbsp;</label><label class="hint" style="display:flex;gap:6px;align-items:center;padding:9px 0"><input id="fxAds" type="checkbox" style="width:auto"> 광고 팩스 (광고성 정보 표기)</label></div>
        </div>
        <div id="fxConfirm" class="sumbox" hidden></div>
        <div class="row"><button class="btn primary" type="submit" id="fxSendBtn" style="flex:1;justify-content:center">발송 확인</button><button class="btn" type="button" id="fxClearBtn">수신처 비우기</button></div>
        <div id="fxErr" class="err" hidden></div>
      </form>
      <div style="min-width:0">
        <div class="resbar">
          <span class="n" id="fxTotal">–</span><span class="what">건 · 발송 내역</span>
          <div class="act">
            <select id="fxRange" aria-label="조회 기간"><option value="0">오늘</option><option value="7" selected>최근 7일</option><option value="30">최근 30일</option><option value="90">최근 3개월</option></select>
            <button class="btn" type="button" id="fxRefresh">새로고침</button>
          </div>
        </div>
        <div class="tablewrap"><table>
          <thead><tr><th>접수</th><th>수신처</th><th>번호</th><th>결과</th><th class="hide-sm">장수</th><th class="hide-sm">제목</th></tr></thead>
          <tbody id="fxRows"><tr><td colspan="6" class="empty">불러오는 중…</td></tr></tbody>
        </table></div>
        <div class="pager" id="fxPager"></div>
      </div>
    </div>
  </section>

<div class="dim" id="dim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="업체 상세"></aside>
<div class="toast" id="toast" hidden></div>

<script>
const API = 'https://qxbhsmgtbbcvuwiecenv.supabase.co/functions/v1/fax-send';
const STAGES = ['미접촉','연락함','관심있음','입점협의','입점완료','보류'];
const TYPE_NAME = { mfr:'경남 제조업체', senior:'경남 노인복지시설', fc:'가맹본부(공정위)' };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const addrOf = it => it.ROAD_NM_ADDR || '';
// 0000…·1111… 같은 자리채움 번호는 없는 번호로 봄
const realTel = v => { const d=String(v||'').replace(/\D/g,''); return d.length>=8 && d.length<=12 && /^0[1-9]/.test(d) && !/^(\d)\1+$/.test(d.slice(1)) ? String(v).trim() : ''; };
const hasFax = it => !!realTel(it.FAXNO);
const state = { type:'mfr', page:1, total:0, items:[], last:null };
let leads = {};          // MNG_NO -> lead doc
let db = null, downloads = null;
let PW = '';
try { PW = localStorage.getItem('fbf_pw') || ''; } catch(e) {}

function toast(msg){ const t=$('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,2400); }
function pill(it){ return hasFax(it) ? '<span class="pill p-ok">팩스 있음</span>' : '<span class="pill p-warn">팩스 없음</span>'; }
const iso = d => new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);

// ---------- API ----------
async function api(p){
  const r = await fetch(API+'?'+new URLSearchParams(p), { headers:{'x-access-pw':PW} });
  const j = await r.json().catch(()=>({error:'서버 응답을 읽지 못했습니다.'}));
  if(r.status===401){ showLogin(PW ? j.error : ''); throw new Error(j.error); }
  if(!r.ok) throw new Error(j.error || '조회에 실패했습니다.');
  return j;
}
function params(page){
  if(state.type==='fc') return { op:'fc', year:$('fYear').value.trim(), q:$('fFq').value, lcls:$('fLcls').value, pageNo:page, numOfRows:$('perPage').value };
  return { op:'gn', src:state.type, q:$('fQ').value, addr:$('fAddr').value, sgg:$('fSgg').value, fax:$('fFaxOnly').checked?'1':'', pageNo:page, numOfRows:$('perPage').value };
}
function fillSgg(list){
  const cur=$('fSgg').value;
  $('fSgg').innerHTML=opt('','전체')+(list||[]).map(x=>opt(x.name,`${x.name} (${x.n.toLocaleString()})`,x.name===cur)).join('');
}
async function search(page=1){
  const b=$('searchBtn'); b.disabled=true; b.textContent=state.type==='fc'?'조회 중…':'불러오는 중… (처음엔 10초쯤)'; $('err').hidden=true;
  const type=state.type;
  try{
    const p=params(page); const j=await api(p);
    if(type!==state.type) return;
    Object.assign(state,{page, total:j.totalCount||0, items:j.items||[], last:p});
    if(type==='fc'){
      if(j.lcls && $('fLcls').options.length<=1) $('fLcls').innerHTML=opt('','전체')+j.lcls.map(x=>opt(x.name,`${x.name} (${x.n.toLocaleString()})`)).join('');
      $('fcNote').textContent=`${$('fYear').value}년 가맹본부 ${Number(j.all||0).toLocaleString()}곳.`;
    } else {
      if(j.sggs && $('fSgg').options.length<=1) fillSgg(j.sggs);
      $('gnNote').textContent=`${TYPE_NAME[type]} 전체 ${Number(j.all||0).toLocaleString()}곳 중 팩스번호가 있는 곳 ${Number(j.withFax||0).toLocaleString()}곳. 경상남도가 실시간 제공하는 자료를 서버가 받아 두고 6시간마다 새로 받습니다.`;
    }
    renderRows();
  }catch(e){ if(!$('loginView').hidden) return; $('err').textContent=e.message; $('err').hidden=false;
    Object.assign(state,{total:0,items:[],last:null}); renderRows(e.message); }
  finally{ b.disabled=false; b.textContent='조회'; }
}
const HEAD={
  mfr:['','회사명','업종','주요생산품','시군','전화번호','팩스번호','주소'],
  senior:['','기관명','시군구','운영·대표','전화번호','팩스번호','주소'],
  fc:['','가맹본부','지역','주소','전화번호','팩스번호','브랜드','업종','대표자'],
};
function renderHead(){ const h=HEAD[state.type]; $('thead').innerHTML='<tr>'+h.map(x=>`<th>${x}</th>`).join('')+'</tr>'; return h.length; }
const short=(v,n=3)=>{ const a=String(v||'').split(', ').filter(Boolean); return a.length>n?a.slice(0,n).join(', ')+` 외 ${a.length-n}`:a.join(', '); };
const telTd=v=>`<td class="mono">${esc(realTel(v))}</td>`;
function renderRows(errMsg){
  const nc=renderHead();
  $('total').textContent=state.total.toLocaleString();
  $('totalWhat').textContent=`건 · ${TYPE_NAME[state.type]}`+(state.type!=='fc'&&$('fFaxOnly').checked?' · 팩스번호 있는 곳':'');
  $('scanNote').hidden=true;
  if(!state.items.length){ $('rows').innerHTML=`<tr><td colspan="${nc}" class="empty">${errMsg?'조회하지 못했습니다. 왼쪽 안내를 확인하세요.':'조건에 맞는 곳이 없습니다. 조건을 넓히거나 검색어를 줄여 보세요.'}</td></tr>`; $('pager').innerHTML=''; return; }
  const star=it=>`<td class="st">${leads[it.MNG_NO]?'★':''}</td>`;
  $('rows').innerHTML=state.items.map((it,i)=>`<tr data-i="${i}">${star(it)}<td class="nm">${esc(it.BPLC_NM)}</td>`+(
    state.type==='mfr' ? `<td>${esc(it.INDUTY)}</td><td>${esc(it.GOODS)}</td><td class="nowrap">${esc(it.SGG)}</td>${telTd(it.TELNO)}${telTd(it.FAXNO)}<td class="addr">${esc(addrOf(it))}</td>`
    : state.type==='senior' ? `<td class="nowrap">${esc(it.SGG)}</td><td class="nowrap">${esc(it.REP)}</td>${telTd(it.TELNO)}${telTd(it.FAXNO)}<td class="addr">${esc(addrOf(it))}</td>`
    : `<td class="nowrap">${esc(it.SGG)}</td><td class="addr">${esc(addrOf(it))}</td>${telTd(it.TELNO)}${telTd(it.FAXNO)}<td>${esc(short(it.BRANDS))}</td><td>${esc(it.INDUTY)}</td><td class="nowrap">${esc(it.REP)}</td>`
  )+'</tr>').join('');
  const pages=Math.ceil(state.total/+$('perPage').value);
  $('pager').innerHTML=pages>1?`<button class="btn" type="button" data-go="${state.page-1}" ${state.page<=1?'disabled':''}>이전</button>
    <span class="mono">${state.page} / ${pages.toLocaleString()}</span>
    <button class="btn" type="button" data-go="${state.page+1}" ${state.page>=pages?'disabled':''}>다음</button>`:'';
}

$('drawer').addEventListener('click', async e=>{
  const t=e.target.closest('button'); if(!t) return;
  if(t.hasAttribute('data-close')) return closeDrawer();
  if(t.hasAttribute('data-fax')){ addRcv([{num:cur.item.FAXNO,name:cur.item.BPLC_NM}]); return; }
  if(t.dataset.copy){ try{ await navigator.clipboard.writeText(t.dataset.copy); toast('전화번호를 복사했습니다'); }catch(_){ toast(t.dataset.copy); } return; }
  const k=cur.item.MNG_NO;
  try{
    if(t.hasAttribute('data-add')){
      await db.collection('leads').doc(k).set({ item:cur.item, type:cur.type, stage:'미접촉', memo:'', savedAt:new Date().toISOString(), updatedAt:new Date().toISOString() });
      leads[k]={item:cur.item,type:cur.type,stage:'미접촉',memo:''}; toast('관심업체에 저장했습니다'); openDrawer(cur.item,cur.type); renderAll();
    } else if(t.hasAttribute('data-save')){
      const stage=$('dStage').value, memo=$('dMemo').value;
      await db.collection('leads').doc(k).update({ stage, memo, updatedAt:new Date().toISOString() });
      toast('저장했습니다'); closeDrawer();
    } else if(t.hasAttribute('data-remove')){ $('confirmBox').hidden=false; }
    else if(t.hasAttribute('data-remove-yes')){
      await db.collection('leads').doc(k).delete(); delete leads[k]; toast('관심업체에서 뺐습니다'); closeDrawer(); renderAll();
    }
  }catch(err){ toast('저장하지 못했습니다: '+(err.message||err.code)); }
});

// ---------- CSV ----------
function csv(rows,extra=[]){
  const labels=[]; rows.forEach(r=>(r.detail||[]).forEach(([n])=>{ if(!labels.includes(n)) labels.push(n); }));
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const head=['이름',...labels,...extra.map(c=>c[1])];
  return '﻿'+[head.map(q).join(',')].concat(rows.map(r=>{ const d=Object.fromEntries(r.detail||[]);
    return [r.BPLC_NM,...labels.map(n=>d[n]),...extra.map(c=>r[c[0]])].map(q).join(','); })).join('\r\n');
}
async function save(filename,text){
  if(!downloads){ toast('이 화면에서는 파일 저장을 쓸 수 없습니다'); return; }
  try{ await downloads.save({filename, data:text}); }
  catch(e){ if(e.code!=='declined') toast('파일을 저장하지 못했습니다'); }
}

// ---------- 팩스 발송 (팝빌) ----------
const FAX={ info:null, page:1, confirm:false };
const digitsOnly=s=>String(s||'').replace(/\D/g,'');
const fmtTel=s=>{ const d=digitsOnly(s); return d.startsWith('02')?d.replace(/^(02)(\d{3,4})(\d{4})$/,'$1-$2-$3'):d.replace(/^(\d{3,4})(\d{3,4})(\d{4})$/,'$1-$2-$3'); };
function parseRcv(){
  const seen=new Set(), ok=[], bad=[];
  $('fxRcvText').value.split('\n').map(l=>l.trim()).filter(Boolean).forEach(l=>{
    const m=l.match(/^([\d\-\s()]+)\s*[,\t]?\s*(.*)$/); const num=digitsOnly(m?m[1]:'');
    if(num.length<8||num.length>12){ bad.push(l); return; }
    if(seen.has(num)) return; seen.add(num); ok.push({num,name:(m[2]||'').trim()});
  });
  return {ok,bad};
}
function saveRcv(){ try{ localStorage.setItem('fax_rcv',$('fxRcvText').value); }catch(e){} }
function renderRcvNote(){
  const {ok,bad}=parseRcv(); $('rcvCount').textContent=ok.length;
  $('fxRcvNote').textContent=`${ok.length}곳`+(bad.length?` · 번호를 읽지 못한 줄 ${bad.length}개는 빠집니다`:'')+(ok.length>100?' · 한 번에 100곳까지만 보낼 수 있습니다':'');
}
function addRcv(list){
  const have=new Set(parseRcv().ok.map(x=>x.num)); let n=0;
  const lines=list.filter(x=>{ const d=digitsOnly(x.num); if(d.length<8||have.has(d)) return false; have.add(d); n++; return true; })
    .map(x=>`${fmtTel(x.num)}, ${String(x.name||'').replace(/[\r\n,]/g,' ')}`);
  if(lines.length){ const t=$('fxRcvText'); t.value=(t.value.trim()?t.value.trim()+'\n':'')+lines.join('\n'); saveRcv(); renderRcvNote(); resetConfirm(); }
  toast(n?`팩스 수신처에 ${n}곳 추가했습니다`:'추가할 새 번호가 없습니다');
}
$('leadsToFaxBtn').onclick=()=>{

  if(!withNo.length) return toast('팩스번호가 있는 관심업체가 없습니다');
  addRcv(withNo.map(v=>({num:v.item.FAXNO,name:v.item.BPLC_NM})));
};
async function faxApi(p,init){
  const r=await fetch(API+'?'+new URLSearchParams(p),{...init,headers:{'x-access-pw':PW,...(init&&init.headers||{})}});
  const j=await r.json().catch(()=>({error:'서버 응답을 읽지 못했습니다.'}));
  if(r.status===401){ showLogin(PW?j.error:''); throw new Error(j.error); }
  if(!r.ok) throw new Error(j.error||'팩스 요청에 실패했습니다.');
  return j;
}
async function openFax(){
  renderRcvNote();
  if(!FAX.info){
    try{
      const j=await faxApi({op:'faxInfo'}); FAX.info=j;
      if(!j.configured){ $('faxStatus').innerHTML=`<span class="pill p-bad">연동 전</span><span class="hint">${esc(j.error)}</span>`; $('fxSender').innerHTML='<option value="">팝빌 연동 후 표시됩니다</option>'; $('fxRows').innerHTML='<tr><td colspan="6" class="empty">팝빌 연동정보를 등록하면 발송 내역이 여기 보입니다.</td></tr>'; return; }
      $('faxStatus').innerHTML=(j.test?'<span class="pill p-warn">테스트 환경 · 실제로 발송되지 않음</span>':'<span class="pill p-ok">실제 발송</span>')
        +(j.unitCost!=null?`<span class="mono">장당 ${Number(j.unitCost).toLocaleString()}P</span>`:'')
        +(j.balance!=null?`<span class="mono">잔여 ${Number(j.balance).toLocaleString()}P</span>`:'')
        +(j.senderError?`<span class="hint">${esc(j.senderError)}</span>`:'');
      const s=j.senders||[]; let last=''; try{ last=localStorage.getItem('fax_sender')||''; }catch(e){}
      $('fxSender').innerHTML=s.length?s.map(x=>opt(x.number,fmtTel(x.number)+(x.memo?' · '+x.memo:'')+(x.state===1?'':' (승인 대기)'),x.number===last||(!last&&x.representYN))).join('')
        :'<option value="">등록된 발신번호가 없습니다 — 팝빌에서 발신번호를 먼저 등록하세요</option>';
    }catch(e){ $('faxStatus').innerHTML=`<span class="pill p-bad">연결 실패</span><span class="hint">${esc(e.message)}</span>`; return; }
  }
  loadFaxHistory(1);
}
const dt14=s=>s&&s.length>=12?`${s.slice(4,6)}-${s.slice(6,8)} ${s.slice(8,10)}:${s.slice(10,12)}`:'';
function faxPill(x){
  if(x.state===3) return x.result===4000?'<span class="pill p-ok">성공</span>':`<span class="pill p-bad">실패 ${esc(x.result)}</span>`;
  if(x.state===4) return '<span class="pill p-warn">취소</span>';
  return `<span class="pill p-stage">${x.state===2?'전송 중':x.reserveDT&&x.state<2?'예약':'대기'}</span>`;
}
async function loadFaxHistory(page){
  if(!FAX.info||!FAX.info.configured) return;
  const days=+$('fxRange').value, from=new Date(); from.setDate(from.getDate()-days);
  $('fxRefresh').disabled=true;
  try{
    const j=await faxApi({op:'faxSearch',from:iso(from),to:iso(new Date()),page});
    FAX.page=j.page; $('fxTotal').textContent=Number(j.total).toLocaleString();
    $('fxRows').innerHTML=j.items.length?j.items.map(x=>`<tr data-r="${esc(x.receiptNum)}" data-st="${x.state}" data-rv="${x.reserveDT?1:0}">
      <td class="mono">${esc(dt14(x.reserveDT||x.receiptDT))}</td><td class="nm">${esc(x.receiveName||'-')}</td>
      <td class="mono">${esc(fmtTel(x.receiveNum))}</td><td>${faxPill(x)}</td>
      <td class="mono hide-sm">${x.state===3?`${x.successPageCnt??0}/${x.sendPageCnt??0}`:esc(x.sendPageCnt??'')}</td>
      <td class="hide-sm">${esc(x.title||'')}</td></tr>`).join('')
      :'<tr><td colspan="6" class="empty">이 기간에 보낸 팩스가 없습니다.</td></tr>';
    $('fxPager').innerHTML=j.pageCount>1?`<button class="btn" type="button" data-go="${j.page-1}" ${j.page<=1?'disabled':''}>이전</button><span class="mono">${j.page} / ${j.pageCount}</span><button class="btn" type="button" data-go="${j.page+1}" ${j.page>=j.pageCount?'disabled':''}>다음</button>`:'';
  }catch(e){ $('fxRows').innerHTML=`<tr><td colspan="6" class="empty">${esc(e.message)}</td></tr>`; }
  finally{ $('fxRefresh').disabled=false; }
}
$('fxRefresh').onclick=()=>loadFaxHistory(1); $('fxRange').onchange=()=>loadFaxHistory(1);
$('fxPager').onclick=e=>{ const b=e.target.closest('[data-go]'); if(b&&!b.disabled) loadFaxHistory(+b.dataset.go); };
$('fxRows').onclick=async e=>{
  const tr=e.target.closest('tr[data-r]'); if(!tr) return;
  if(tr.dataset.rv==='1' && +tr.dataset.st<2){
    if(!confirm('이 예약 팩스를 취소할까요? (같은 접수번호로 묶인 수신처가 모두 취소됩니다)')) return;
    try{ await faxApi({op:'faxCancel',receiptNum:tr.dataset.r},{method:'POST'}); toast('예약을 취소했습니다'); loadFaxHistory(FAX.page); }catch(err){ toast(err.message); }
  }
};
function resetConfirm(){ FAX.confirm=false; $('fxConfirm').hidden=true; $('fxSendBtn').textContent='발송 확인'; }
['fxSender','fxTitle','fxFiles','fxReserve','fxAds','fxSenderName'].forEach(id=>$(id).addEventListener('change',resetConfirm));
$('fxRcvText').addEventListener('input',()=>{ saveRcv(); renderRcvNote(); resetConfirm(); });
$('fxClearBtn').onclick=()=>{ $('fxRcvText').value=''; saveRcv(); renderRcvNote(); resetConfirm(); };
try{ $('fxRcvText').value=localStorage.getItem('fax_rcv')||''; $('fxSenderName').value=localStorage.getItem('fax_sndnm')||''; }catch(e){}
renderRcvNote();
$('faxForm').onsubmit=async e=>{
  e.preventDefault(); $('fxErr').hidden=true;
  const {ok}=parseRcv(), files=[...$('fxFiles').files], sender=$('fxSender').value;
  const size=files.reduce((s,f)=>s+f.size,0);
  const problem=!FAX.info||!FAX.info.configured?'팝빌 연동정보가 아직 없습니다.':!sender?'발신번호를 고르세요.':!ok.length?'수신처를 1곳 이상 넣으세요.':ok.length>100?'한 번에 100곳까지 보낼 수 있습니다.':!files.length?'보낼 파일을 첨부하세요.':files.length>5?'파일은 5개까지입니다.':size>10*1024*1024?'파일 합계가 10MB를 넘습니다.':'';
  if(problem){ $('fxErr').textContent=problem; $('fxErr').hidden=false; return; }
  const rsv=$('fxReserve').value;
  if(!FAX.confirm){
    const u=FAX.info.unitCost;
    $('fxConfirm').innerHTML=`<strong>${ok.length}곳에 ${files.length}개 파일을 ${rsv?esc(rsv.replace('T',' '))+'에 예약':'지금'} 보냅니다.</strong>
      <span>발신 ${esc(fmtTel(sender))} · ${esc(files.map(f=>f.name).join(', '))}</span>
      ${u!=null?`<span>예상 비용: 장당 ${Number(u).toLocaleString()}P × 장수 × ${ok.length}곳 (실패한 장은 환불)</span>`:''}
      ${FAX.info.test?'<span>테스트 환경이라 실제 팩스는 나가지 않습니다.</span>':'<span><strong>실제로 발송되며 취소할 수 없습니다.</strong></span>'}`;
    $('fxConfirm').hidden=false; FAX.confirm=true; $('fxSendBtn').textContent=`${ok.length}곳에 발송`; return;
  }
  const fd=new FormData();
  fd.append('sender',sender); fd.append('senderName',$('fxSenderName').value); fd.append('title',$('fxTitle').value);
  fd.append('receivers',JSON.stringify(ok)); if($('fxAds').checked) fd.append('ads','1');
  if(rsv) fd.append('reserveDT',rsv.replace(/\D/g,'').padEnd(14,'0'));
  files.forEach(f=>fd.append('file',f,f.name));
  const b=$('fxSendBtn'); b.disabled=true; b.textContent='보내는 중…';
  try{
    const j=await faxApi({op:'faxSend'},{method:'POST',body:fd});
    try{ localStorage.setItem('fax_sender',sender); localStorage.setItem('fax_sndnm',$('fxSenderName').value); }catch(e){}
    toast(`${j.count}곳 접수했습니다 (접수번호 ${j.receiptNum})`);
    $('fxFiles').value=''; resetConfirm(); setTimeout(()=>loadFaxHistory(1),1500);
  }catch(err){ $('fxErr').textContent=err.message; $('fxErr').hidden=false; resetConfirm(); }
  finally{ b.disabled=false; if(!FAX.confirm) b.textContent='발송 확인'; }
};

// ---- 저장소: 이 브라우저(localStorage)에 관심업체 보관 ----
(function(){
  const KEY='fbf_leads';
  const read=()=>{ try{ return JSON.parse(localStorage.getItem(KEY)||'{}'); }catch(e){ return {}; } };
  const subs=[];
  const write=o=>{ try{ localStorage.setItem(KEY,JSON.stringify(o)); }catch(e){ throw new Error('브라우저 저장소를 쓸 수 없습니다'); } emit(); };
  const emit=()=>{ const o=read(); const snap={docs:Object.keys(o).map(id=>({id,data:()=>o[id]}))}; subs.forEach(f=>f(snap)); };
  db={ collection:()=>({
    doc:id=>({
      set:async d=>{ const o=read(); o[id]=d; write(o); },
      update:async d=>{ const o=read(); o[id]={...(o[id]||{}),...d}; write(o); },
      delete:async()=>{ const o=read(); delete o[id]; write(o); },
    }),
    onSnapshot:f=>{ subs.push(f); setTimeout(emit); },
  })};
  window.addEventListener('storage',e=>{ if(e.key===KEY) emit(); });
  downloads={ save:async({filename,data})=>{
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type:'text/csv;charset=utf-8'}));
    a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); } };
  db.collection('leads').onSnapshot(snap=>{ leads={}; snap.docs.forEach(d=>{ leads[d.id]=d.data(); }); renderAll(); });
})();
</script>
